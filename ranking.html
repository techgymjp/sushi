<!doctype html>
<html lang="ja" data-page-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランキング｜回転寿司へいお待ち！</title>
<meta name="description" content="回転寿司へいお待ち！のランキング。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
<script src="i18n.js"></script>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="logo" href="index.html">回転寿司<span>へいお待ち！</span></a>
    <nav class="nav">
      <a href="index.html">トップ</a>
      <a href="howto.html">遊び方</a>
      <a href="ranking.html" aria-current="page">ランキング</a>
      <a href="game.html?lang=ja" class="play">あそぶ</a>
      <a href="en/ranking.html" class="lang-link" lang="en">EN</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-title">
    <h1>ランキング</h1>
    <p>売上トップ10の板前たち</p>
  </div>

  <section>
    <div class="panel">
      <div id="rankBox" class="rank-page"></div>
      <p class="rank-note">※ ランキングはこのブラウザに保存されます。別の端末やブラウザの記録は表示されません。</p>
    </div>
  </section>

  <section class="cta">
    <div class="btn-row">
      <a class="btn" href="game.html?lang=ja">記録に挑戦する</a>
      <button type="button" class="btn sub" id="clearBtn">記録を消す</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  回転寿司へいお待ち！ ／ <a href="index.html">トップ</a> ／ <a href="howto.html">遊び方</a> ／ <a href="game.html?lang=ja">あそぶ</a>
</footer>
<script src="ranking.js"></script>
<script>
  const box = document.getElementById('rankBox');
  SushiRanking.render(box, { full: true });
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.hidden = !SushiRanking.load().length;
  clearBtn.addEventListener('click', () => {
    if (!confirm('このブラウザのランキング記録をすべて消します。よろしいですか？')) return;
    SushiRanking.clear();
    SushiRanking.render(box, { full: true });
    clearBtn.hidden = true;
  });
</script>
</body>
</html>
